services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: porter
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter
    ports:
      - "5433:5432"
    volumes:
      - porter-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  porter-postgres-data:
